<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | كلية الإعلام - جامعة الأزهر</title>
    <!-- استدعاء خط تاجوال من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <!-- الشعار أو العنوان -->
            <div class="logo-section">
                <h2>كلية الإعلام</h2>
                <p>جامعة الأزهر</p>
            </div>

            <!-- أزرار التبديل بين الطالب والإدارة -->
            <div class="toggle-buttons">
                <button id="student-tab" class="active" onclick="switchTab('student')">دخول طالب</button>
                <button id="admin-tab" onclick="switchTab('admin')">دخول إدارة</button>
            </div>

            <!-- فورم دخول الطالب -->
            <form id="student-form" class="login-form">
                <div class="input-group">
                    <label for="student-code">كود الطالب</label>
                    <input type="text" id="student-code" placeholder="أدخل الكود الجامعي" required>
                </div>
                <div class="input-group">
                    <label for="student-password">كلمة المرور</label>
                    <input type="password" id="student-password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
            </form>

            <!-- فورم دخول الإدارة (مخفي افتراضياً) -->
            <form id="admin-form" class="login-form hidden">
                <div class="input-group">
                    <label for="admin-code">كود الإدارة</label>
                    <input type="text" id="admin-code" placeholder="كود مسؤول النظام" required>
                </div>
                <div class="input-group">
                    <label for="admin-password">كلمة المرور</label>
                    <input type="password" id="admin-password" placeholder="كلمة المرور" required>
                </div>
                <!-- حقل الباص كود الخاص المخفي للحماية المزدوجة -->
                <div class="input-group">
                    <label for="admin-secret">باص الحماية الخاص</label>
                    <input type="password" id="admin-secret" placeholder="رمز الحماية" required>
                </div>
                <button type="submit" class="btn-primary">دخول للوحة التحكم</button>
            </form>
            
            <!-- رسائل الخطأ تظهر هنا -->
            <p id="error-message" class="error-msg"></p>
        </div>
    </div>

    <!-- التذييل الثابت -->
    <footer>
        <p>تم التنفيذ والتطوير بواسطة: (أحمد سمير) | (عمار منصور)</p>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
